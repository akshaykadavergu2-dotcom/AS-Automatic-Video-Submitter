<svg width="400" height="90" viewBox="0 0 400 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Brand Emblem Shield -->
  <rect x="5" y="5" width="80" height="80" rx="14" fill="url(#logoBg)" stroke="url(#goldAcc)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Stylized Telugu 'ప్ర' (Pra) Emblem -->
  <text x="45" y="58" font-family="'Noto Sans Telugu', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">ప్ర</text>
  <circle cx="45" cy="18" r="4" fill="#fbbf24"/>

  <!-- Brand Typography -->
  <text x="100" y="38" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1.5">PRAJA SANKETAM</text>
  <rect x="100" y="47" width="280" height="3" rx="1.5" fill="url(#goldAcc)"/>
  
  <text x="100" y="70" font-family="'Noto Sans Telugu', sans-serif" font-weight="700" font-size="16" fill="#fbbf24">AI న్యూస్ స్టూడియో • 24x7 డిజిటల్ నెట్‌వర్క్</text>
</svg>
