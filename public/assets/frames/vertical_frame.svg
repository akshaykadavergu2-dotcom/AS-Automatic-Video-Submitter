<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="vPlateDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <!-- Top Frame Border -->
  <rect x="0" y="0" width="1080" height="10" fill="url(#vRed)"/>

  <!-- Vertical Shorts Brand Header -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="960" height="96" rx="16" fill="url(#vPlateDark)" stroke="#dc2626" stroke-width="2"/>
    <circle cx="50" cy="48" r="30" fill="#dc2626"/>
    <text x="50" y="60" font-family="'Noto Sans Telugu', sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">ప్ర</text>
    <text x="100" y="44" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#ffffff">PRAJA SANKETAM</text>
    <text x="100" y="74" font-family="'Noto Sans Telugu', sans-serif" font-weight="700" font-size="20" fill="#fbbf24">AI న్యూస్ స్టూడియో • SHORTS</text>
  </g>

  <!-- Lower Third Frame Overlay for Mobile -->
  <g transform="translate(60, 1450)">
    <rect x="0" y="0" width="960" height="320" rx="16" fill="url(#vPlateDark)" stroke="#374151" stroke-width="2"/>
    <rect x="0" y="0" width="960" height="10" rx="5" fill="#dc2626"/>
    <text x="40" y="70" font-family="'Noto Sans Telugu', sans-serif" font-weight="900" font-size="40" fill="#ffffff">[వర్టికల్ న్యూస్ హెడ్‌లైన్]</text>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(0, 1820)">
    <rect x="0" y="0" width="1080" height="100" fill="#050811"/>
    <rect x="0" y="0" width="220" height="100" fill="#dc2626"/>
    <text x="110" y="60" font-family="'Noto Sans Telugu', sans-serif" font-weight="900" font-size="26" fill="#ffffff" text-anchor="middle">అప్‌డేట్స్</text>
  </g>
</svg>
