<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lsRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="lsDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </linearGradient>
  </defs>

  <!-- Broadcast Border Accents -->
  <rect x="0" y="0" width="1920" height="8" fill="url(#lsRed)"/>
  
  <!-- Channel Logo Bug Top Left -->
  <g transform="translate(48, 36)">
    <rect x="0" y="0" width="320" height="60" rx="8" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <rect x="8" y="8" width="44" height="44" rx="6" fill="#dc2626"/>
    <text x="30" y="38" font-family="'Noto Sans Telugu', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">ప్ర</text>
    <text x="64" y="28" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#ffffff">PRAJA SANKETAM</text>
    <text x="64" y="47" font-family="'Noto Sans Telugu', sans-serif" font-weight="700" font-size="13" fill="#fbbf24">AI న్యూస్ స్టూడియో</text>
  </g>

  <!-- Live Bug Top Right -->
  <g transform="translate(1640, 36)">
    <rect x="0" y="0" width="90" height="42" rx="6" fill="#dc2626"/>
    <circle cx="20" cy="21" r="5" fill="#ffffff"/>
    <text x="54" y="27" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">LIVE</text>
    <rect x="98" y="0" width="130" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="163" y="27" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#e2e8f0" text-anchor="middle">24x7 NEWS</text>
  </g>

  <!-- Lower Third Plate Frame Template -->
  <g transform="translate(48, 860)">
    <!-- Breaking Tag -->
    <path d="M 0 0 L 220 0 L 200 44 L 0 44 Z" fill="#dc2626"/>
    <text x="100" y="30" font-family="'Noto Sans Telugu', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">బ్రేకింగ్ న్యూస్</text>
    
    <!-- Headline Box -->
    <rect x="0" y="44" width="1824" height="96" rx="4" fill="url(#lsDark)" stroke="#dc2626" stroke-width="2"/>
    <rect x="0" y="44" width="12" height="96" fill="#fbbf24"/>
    <text x="36" y="104" font-family="'Noto Sans Telugu', sans-serif" font-weight="800" font-size="32" fill="#ffffff">[హెడ్‌లైన్ ప్రివ్యూ ఫ్రేమ్]</text>
  </g>

  <!-- Bottom Ticker Plate -->
  <g transform="translate(0, 1016)">
    <rect x="0" y="0" width="1920" height="64" fill="#050811"/>
    <rect x="0" y="0" width="200" height="64" fill="#dc2626"/>
    <text x="100" y="40" font-family="'Noto Sans Telugu', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">తాజా వార్తలు</text>
  </g>
</svg>
